services:
  web:
    build:
      context: ./backend
    env_file:
      - backend/.env
    environment:
      SERVER_HOST: 0.0.0.0
      PORT: 8000
    command: >
      sh -c 'export DATABASE_URL="postgresql+psycopg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/$${POSTGRES_DB}" &&
      gunicorn
      --bind 0.0.0.0:8000
      --workers "$${GUNICORN_WORKERS:-2}"
      --threads "$${GUNICORN_THREADS:-4}"
      --timeout "$${GUNICORN_TIMEOUT:-60}"
      app:app'
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - installer-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    env_file:
      - backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kings-cbt-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kings-cbt-db:
  installer-uploads:
